services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chưa đặt POSTGRES_PASSWORD - hãy copy infra/.env.example thành infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-docflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - docflow_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docflow_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Chưa đặt MINIO_ROOT_PASSWORD - hãy copy infra/.env.example thành infra/.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - docflow_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  docflow_network:
    driver: bridge
