services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chưa đặt POSTGRES_PASSWORD - hãy copy infra/.env.example thành infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-docflow_db}
    ports:
      - "127.0.0.1:5432:5432" # chỉ máy bạn kết nối được, máy khác cùng Wi-Fi thì không
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docflow_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docflow_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Chưa đặt MINIO_ROOT_PASSWORD - hãy copy infra/.env.example thành infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - docflow_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  docflow_network:
    driver: bridge
