# CI chạy trên mọi Pull Request và mỗi lần main thay đổi.
# 4 job dưới đây là 4 "check" bắt buộc phải xanh trước khi mentor merge (cấu hình trong ruleset của main).
# Cách chạy từng job trên máy bạn: xem CONTRIBUTING.md, mục "Kiểm tra tự động".
# Mọi job ghim ubuntu-24.04 (khớp WSL Ubuntu 24.04 của học viên); không dùng ubuntu-latest vì nhãn này tự đổi phiên bản.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Cấu trúc repo, tài liệu task, tracker, dữ liệu mẫu, file bị cấm, lint/format Python, cú pháp compose.
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Cài công cụ kiểm tra
        run: uv venv --python 3.12 && uv pip install -r requirements-dev.txt
      - name: File bị cấm
        run: .venv/bin/python scripts/check_forbidden_files.py --all
      - name: Ruff lint
        run: .venv/bin/ruff check .
      - name: Ruff format
        run: .venv/bin/ruff format --check .
      - name: Docker Compose hợp lệ với .env.example
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml config --quiet
      - name: Gate test cấu trúc repo
        run: .venv/bin/pytest tests/gates/test_repo_hygiene.py -q

  # Chạy infra/sql/init.sql trên Postgres + pgvector thật và thử từng ràng buộc.
  schema:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Không có database thì ĐỎ, không được "xanh giả" bằng skip
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Cài công cụ kiểm tra
        run: uv venv --python 3.12 && uv pip install -r requirements-dev.txt
      - name: Gate test schema mẫu (infra/sql/init.sql)
        run: .venv/bin/pytest tests/gates/test_schema_constraints.py -q
      - name: Gate test schema của học viên (db/schema.sql, Task 0.4)
        run: |
          if [ ! -f db/schema.sql ]; then
            echo "Chưa có db/schema.sql (Task 0.4), chưa có gì để kiểm tra."
            exit 0
          fi
          INIT_SQL_PATH=db/schema.sql .venv/bin/pytest tests/gates/test_schema_constraints.py -q

  # Unit test của chính học viên (từ Task 1.0): cài dự án theo pyproject.toml rồi chạy mọi test ngoài tests/gates/.
  # Chưa có pyproject.toml thì bỏ qua (xanh); đã có pyproject.toml mà không có test nào thì pytest báo đỏ.
  # Có sẵn Postgres + pgvector: DATABASE_URL là tài khoản quản trị để test tích hợp tự dựng database, schema và role.
  unit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Unit test của học viên
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "Chưa có pyproject.toml (Task 1.0), chưa có unit test để chạy."
            exit 0
          fi
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt -e .
          .venv/bin/pytest tests --ignore=tests/gates -q

  # Quét mật khẩu / API key / token trong toàn bộ lịch sử Git.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git . --no-banner --redact
